name: CI/CD Pipeline

on: [push, pull_request]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set environment variables and Save state
              run:  echo "{APP}={rtree}" >> $GITHUB_STATE
            - name: Set output
              run: echo "{APP}={rtree}" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v1

            - name: Build Docker image
              run: "docker build -t rtree:latest ."

    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Run linter
              run: docker run --rm -v $(pwd):/app -w /app ${APP}:latest cargo clippy -- -D warnings

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Run tests
              run: docker run --rm -v $(pwd):/app -w /app {APP}:latest cargo test

    deploy:
        runs-on: ubuntu-latest
        needs: [build, lint, test]
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Log in to Docker Hub
              uses: docker/login-action@v1
              with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Push Docker image
              run: docker push $APP:latest

